name: CI triage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run ID to triage
        required: true
        type: string

concurrency:
  group: ci-triage-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha || github.event.inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  models: read
  actions: read
  checks: read

jobs:
  triage:
    name: Triage CI result
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Load run metadata
        id: run
        uses: actions/github-script@v9
        with:
          script: |
            const id = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.run_id
              : context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(id)
            })
            core.setOutput('id', String(run.id))
            core.setOutput('conclusion', run.conclusion || '')
            core.setOutput('event', run.event || '')
            core.setOutput('head_branch', run.head_branch || '')
            core.setOutput('head_sha', run.head_sha || '')
            core.setOutput('html_url', run.html_url || '')

      - name: Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.run.outputs.id }}
          RUN_CONCLUSION: ${{ steps.run.outputs.conclusion }}
          RUN_EVENT: ${{ steps.run.outputs.event }}
          RUN_HEAD_BRANCH: ${{ steps.run.outputs.head_branch }}
          RUN_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          RUN_HTML_URL: ${{ steps.run.outputs.html_url }}
        run: node .github/scripts/ci-triage.mjs
