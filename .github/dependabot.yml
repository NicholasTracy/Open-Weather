version: 2
updates:
  - package-ecosystem: npm
    directory: /software
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - software
      - dependencies
    groups:
      app-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
      - dependencies
